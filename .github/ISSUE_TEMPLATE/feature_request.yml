name: Feature Request
description: Propose a new feature or improvement
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Describe the problem first, then the solution.

  - type: textarea
    id: use_case
    attributes:
      label: Use Case
      description: What scenario needs this feature? Describe the real-world situation where you'd use it.
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Current Limitation
      description: What's the gap in Summoner today? What can't you do?
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: Current Workaround
      description: How are you solving this today? (even if it's manual)
    validations:
      required: false

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: What would you like Summoner to do? Be specific about the UX and behavior.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What other approaches have you considered?

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - New command / workflow
        - Hooks (SessionStart/PreToolUse/Stop)
        - Memory Chain (SQLite)
        - Checkpoint Protocol
        - Personas (code-reviewer / security-auditor / test-engineer)
        - Manifest / summoner.yaml
        - Platform adapter (non-Claude-Code support)
        - Documentation
        - Other
    validations:
      required: true

  - type: checkboxes
    id: scope
    attributes:
      label: Scope Check
      options:
        - label: This feature would benefit users across different projects (not project-specific)
          required: true
        - label: This feature aligns with Summoner's design philosophy (portable, project-agnostic)
          required: true
