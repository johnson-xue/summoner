name: Feature Request
description: Propose a new feature or improvement
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Describe the problem first, then the solution.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem are you trying to solve? What's the current limitation?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: What would you like Summoner to do? Be specific.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What other approaches have you considered? Workarounds?

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - new command
        - hooks
        - memory
        - checkpoint protocol
        - personas
        - manifest / config
        - documentation
        - other
    validations:
      required: true

  - type: checkboxes
    id: scope
    attributes:
      label: Scope Check
      options:
        - label: This feature would benefit users across different projects (not project-specific)
          required: true
        - label: This feature aligns with Summoner's design philosophy (portable, project-agnostic)
          required: true
