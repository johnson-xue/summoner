name: Bug Report
description: Report a bug in Summoner
title: "bug: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the information below.

  - type: input
    id: version
    attributes:
      label: Summoner Version
      description: Which version are you using? (check `plugin.json` or CHANGELOG.md)
      placeholder: "v0.2.0"
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: Platform
      description: Which AI coding platform are you using Summoner with?
      placeholder: "Claude Code / Gemini CLI / Cursor / OpenCode / Aider"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: "macOS 14.0 / Ubuntu 24.04 / Windows 11"
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of Summoner is affected?
      options:
        - Hooks (SessionStart/PreToolUse/Stop)
        - Memory Chain (Phase 0 retrieval)
        - Checkpoint Protocol
        - Command routing (/summoner:fix/new/ship/etc)
        - Skill resolution (manifest parsing)
        - Platform adapter (Gemini/OpenCode/Cursor/etc)
        - Scripts (init / validate / memory)
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Provide exact steps so we can reproduce the issue.
      placeholder: |
        1. Run `/summoner:fix ...`
        2. At checkpoint, select 'skip'
        3. Observe...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Screenshots
      description: Paste any error messages, hook output, or screenshots.
