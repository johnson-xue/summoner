# Summoner v2 capability/provider examples — not a workflow or execution order.
# Every capability declares exactly ONE default provider (validate-repo.sh
# enforces it); alternates are explicit choices for work within the phase,
# never a chained fallback and never a second generic methodology copy —
# duplicates of superpowers/built-in methodology have no row here
# (references/capability-map.md is the authority table). Projects replace
# these examples with installed inline domain skills.
# Review describes WHAT to verify; the independent reviewer decides HOW.

phases:
  requirements:
    skill:
      default: superpowers:brainstorming

  plan:
    skill:
      default: superpowers:writing-plans

  implement:
    # Implementation and local tests stay together in the main session.
    skill:
      default: superpowers:executing-plans

  fix:
    skill:
      default: superpowers:executing-plans

  test:
    skill:
      default: superpowers:test-driven-development

  reproduce:
    skill:
      default: superpowers:test-driven-development

  diagnosis:
    # Root cause must be accepted before any repair work starts.
    skill:
      default: superpowers:systematic-debugging

  verify:
    skill:
      default: superpowers:verification-before-completion

  regression:
    skill:
      default: superpowers:verification-before-completion

  ops:
    # No generic deployment provider; configure the project's inline skill.
    skill:
      default: none

  review:
    verification_spec:
      # Add project acceptance criteria and registered checks here.
      # Security, correctness, impact and negative-test expectations are
      # criteria/rubric dimensions, not separate job-role agents.
      criteria: []
      check_ids: []
      readable: []
      rubric: plugin:agents/reviewer.md

# --quick selects only the default providers above. It emits no budget or
# tool permission grants. Confirm any later suggestions at the first
# checkpoint; all capabilities live under the same reducer.
