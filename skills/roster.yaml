# Summoner v2 capability/provider examples — not a workflow or execution order.
# A scalar skill names the unique default. Expanded bindings explicitly label
# default/alternate; alternates are choices, never a chained fallback roster.
# Projects replace these examples with installed inline domain skills.
# Review describes WHAT to verify; the independent reviewer decides HOW.

phases:
  requirements:
    skill:
      default: superpowers:brainstorming
      alternate: [grill-me]

  plan:
    skill:
      default: superpowers:writing-plans
      alternate: [planning-with-files]

  implement:
    # Implementation and local tests stay together in the main session.
    skill: superpowers:executing-plans

  fix:
    skill: superpowers:executing-plans

  test:
    skill:
      default: superpowers:test-driven-development
      alternate: [tdd]

  reproduce:
    skill: superpowers:test-driven-development

  diagnosis:
    # Root cause must be accepted before any repair work starts.
    skill: superpowers:systematic-debugging

  verify:
    skill: superpowers:verification-before-completion

  regression:
    skill: superpowers:verification-before-completion

  ops:
    # No generic deployment provider; configure the project's inline skill.
    skill: none

  review:
    verification_spec:
      # Add project acceptance criteria and registered checks here.
      # Security, correctness, impact and negative-test expectations are
      # criteria/rubric dimensions, not separate job-role agents.
      criteria: []
      check_ids: []
      readable: []
      rubric: plugin:agents/reviewer.md

# --quick selects only the default providers above, not the alternate examples.
# It emits no budget or tool permission grants. Confirm any later suggestions
# at the first checkpoint; all capabilities live under the same reducer.
